<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ws-chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  .bar { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #aaa; }
  .dot.on { background: #2ecc71; }
  #log { border: 1px solid #ddd; border-radius: 8px; height: 260px; overflow-y: auto; padding: .5rem; font-size: .95rem; }
  #log div { padding: 2px 0; }
  #log .me { color: #1a73e8; }
  #log .sys { color: #888; font-size: .85rem; }
  form { display: flex; gap: .5rem; margin-top: .5rem; }
  input { flex: 1; padding: .5rem; font-size: 1rem; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  #count { font-size: 2rem; margin: 0 .5rem; }
  #typing { height: 1.2rem; color: #888; font-size: .85rem; }
</style>
</head>
<body>
<h1>WebSocket 실시간 테스트</h1>
<p>이 페이지를 <b>브라우저 탭 두 개</b>(또는 폰)로 열어보세요. 한쪽에서 보낸 메시지와 카운터가 다른 쪽에 즉시 나타나야 합니다.</p>

<div class="bar">
  <span class="dot" id="dot"></span>
  <span id="status">연결 중…</span>
  <span id="online"></span>
</div>

<div class="bar">
  <button id="plus" type="button">공유 카운터 +1</button>
  <span id="count">0</span>
  <span id="by"></span>
</div>

<div id="log"></div>
<div id="typing"></div>
<form id="form">
  <input id="input" placeholder="메시지를 입력하고 Enter" autocomplete="off">
  <button>보내기</button>
</form>

<script>
const $ = (id) => document.getElementById(id);
let me = null;
let typingTimer = null;
const ws = new WebSocket(location.origin.replace(/^http/, 'ws'));

const log = (text, cls = '') => {
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
};

ws.onopen = () => { $('dot').classList.add('on'); $('status').textContent = '연결됨'; };
ws.onclose = () => { $('dot').classList.remove('on'); $('status').textContent = '끊김 (서버가 꺼졌나요? Go Live 를 다시 눌러보세요)'; };
ws.onmessage = (e) => {
  const m = JSON.parse(e.data);
  if (m.type === 'welcome') { me = m.id; $('count').textContent = m.counter; log(`나는 #${me} 입니다`, 'sys'); }
  if (m.type === 'presence') { $('online').textContent = `· 접속 ${m.online}명`; log(m.text, 'sys'); }
  if (m.type === 'chat') log(`#${m.from}: ${m.text}`, m.from === me ? 'me' : '');
  if (m.type === 'counter') { $('count').textContent = m.counter; $('by').textContent = `(#${m.by} 가 눌렀어요)`; }
  if (m.type === 'typing' && m.from !== me) {
    $('typing').textContent = `#${m.from} 님이 입력 중…`;
    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => ($('typing').textContent = ''), 1200);
  }
};

$('form').onsubmit = (e) => {
  e.preventDefault();
  const text = $('input').value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ type: 'chat', text }));
  $('input').value = '';
};
$('input').oninput = () => ws.send(JSON.stringify({ type: 'typing' }));
$('plus').onclick = () => ws.send(JSON.stringify({ type: 'count' }));
</script>
</body>
</html>
